<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juliu's | Seu Carrinho</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/carrinho.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <div class="logo-container">
                <a href="../index.html"><img src="../img/logo.png" alt="Julio's Logo" class="main-logo"></a>
            </div>

            <nav class="nav-menu" id="navMenu">
                <ul>
                    <li><a href="../index.html">HOME</a></li>
                    <li><a href="cardapio.html">CARDÁPIO</a></li>
                    <li><a href="login.html">LOGIN</a></li>
                    <li class="cart-btn" onclick="location.href='../index.html'">
                        <img src="../img/carrinho-de-compras.png" alt="Carrinho" class="icon-cart" style="width: 30px; height: 30px;">
                        <span id="cart-count">0</span>
                    </li>
                </ul>
            </nav>

            <button class="hamburger" id="hamburger">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </button>
        </div>
    </header>

    <main class="cart-container">
        <h2><i class="fas fa-shopping-basket"></i> SEU CARRINHO</h2>
        
        <div class="cart-wrapper">
            <div id="cart-items" class="cart-items-list">
                <p class="empty-msg">Carregando seu pedido... ðŸ”¥</p>
            </div>

            <aside class="cart-summary">
                <h3>RESUMO</h3>
                <div class="summary-item">
                    <span>Subtotal</span>
                    <span id="subtotal">R$ 0,00</span>
                </div>
                <div class="summary-item">
                    <span>Taxa de Entrega</span>
                    <span id="delivery-fee">R$ 5,00</span>
                </div>
                <hr style="border: 0; border-top: 1px solid #222; margin: 15px 0;">
                <div class="summary-item total">
                    <span>TOTAL</span>
                    <span id="total-geral">R$ 0,00</span>
                </div>
                
                <textarea id="cart-obs" placeholder="Alguma observação? (Ex: Sem cebola, trocar queijo...)" style="width: 100%; height: 80px; background: #000; border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; margin-top: 15px; resize: none;"></textarea>

                <button class="btn-checkout" onclick="finalizarPedido()">FINALIZAR NO WHATSAPP</button>
                <a href="../index.html" style="display: block; text-align: center; color: #888; text-decoration: none; margin-top: 15px; font-size: 0.9rem;">+ Adicionar mais itens</a>
            </aside>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
